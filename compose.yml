services:
  munchkin-server:
    build: .
    ports:
      - "8765:8765"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8765}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 chars)}
      MUNCHKIN_DB_PATH: /var/lib/munchkin/munchkin.db
      MUNCHKIN_LOG_DIR: /app/server/logs
      MUNCHKIN_ALLOWED_ORIGINS: ${MUNCHKIN_ALLOWED_ORIGINS:-}
      MUNCHKIN_TRUST_PROXY: ${MUNCHKIN_TRUST_PROXY:-}
    volumes:
      - munchkin-data:/var/lib/munchkin
      - munchkin-logs:/app/server/logs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - "/tmp"

volumes:
  munchkin-data:
  munchkin-logs:
