name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — compile, test, lint & R8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Compile, unit tests & lint
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Verify R8 minification
        env:
          KEYSTORE_STORE_PASSWORD: cipassword123
          KEYSTORE_KEY_ALIAS: ci
          KEYSTORE_KEY_PASSWORD: cipassword123
        run: |
          keytool -genkeypair -v -keystore munchkin.keystore -alias ci -keyalg RSA -keysize 2048 -validity 1 -storepass cipassword123 -keypass cipassword123 -dname "CN=CI"
          ./gradlew :app:minifyReleaseWithR8 --stacktrace

      - name: Clean up ephemeral keystore
        if: always()
        run: rm -f munchkin.keystore

      - name: Upload test & lint reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Server — audit, syntax, tests & security probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Audit dependencies
        working-directory: server
        run: npm audit --audit-level=high

      - name: Syntax & type check
        working-directory: server
        run: npm run check

      - name: Unit & integration tests
        working-directory: server
        run: npm test

      - name: Run live security verification probe
        run: |
          set -euo pipefail
          JWT_SECRET="$(openssl rand -hex 32)"
          export JWT_SECRET
          export PORT=18765
          export MUNCHKIN_DB_PATH=/tmp/ci-munchkin.db
          export MUNCHKIN_LOG_DIR=/tmp/ci-munchkin-logs
          export MUNCHKIN_REGISTER_LIMIT=100

          cleanup() {
            if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            rm -rf /tmp/ci-munchkin.db* /tmp/ci-munchkin-logs
          }
          trap cleanup EXIT INT TERM

          node server/server.js &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited prematurely during startup" >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:18765/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for http://127.0.0.1:18765/health" >&2
            exit 1
          fi

          MUNCHKIN_SERVER_URL=ws://127.0.0.1:18765 python3 scripts/security_verify.py
