name: CI

# Runs on every push and pull request, not just tags.
#
# v2.20.10, .11 and .12 were all published while the release workflow was failing:
# it only triggered on tags, only built the release APK, and never ran a test. The
# jobs below are the gate that was missing — see the branch-protection note in
# CONTRIBUTING or ask a maintainer to require them on main.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiling the debug variant is the check that would have caught the
      # unresolved imports shipped in v2.20.12. It needs no signing keystore.
      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:test --stacktrace

      - name: Translation parity (es / en / fr)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests/
          retention-days: 7

  server:
    name: Server — syntax + unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Syntax check
        working-directory: server
        run: npm run check

      # Covers validation.test.js (pure helpers) and protocol.test.js, which boots
      # the real server on a free port and drives it over a WebSocket.
      - name: Tests
        working-directory: server
        run: npm test
