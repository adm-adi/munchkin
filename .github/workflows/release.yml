name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Verify & Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Server audit & tests
        working-directory: server
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check
          npm test

      - name: Android unit tests & lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Validate & decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_STORE_PASSWORD KEYSTORE_KEY_ALIAS KEYSTORE_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required signing secret $var is missing or empty" >&2
              exit 1
            fi
          done
          (
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > munchkin.keystore
          )
          if [ ! -s munchkin.keystore ]; then
            echo "::error::Decoded munchkin.keystore is empty" >&2
            exit 1
          fi

      - name: Build Release APK
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Generate SHA-256 sidecars
        run: |
          set -euo pipefail
          (
            cd app/build/outputs/apk/release
            for f in *.apk; do
              [ -e "$f" ] || exit 1
              sha256sum "$f" > "$f.sha256"
            done
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Clean up signing keystore
        if: always()
        run: shred -u munchkin.keystore 2>/dev/null || rm -f munchkin.keystore

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
